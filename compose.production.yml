# vscc PRODUCTION overlay for the LAN app host prd-ubu-apphost (192.168.1.212).
#
#   docker compose -p vscc -f docker-compose.yml -f compose.production.yml up -d
#   (deploy/vscc-up.sh wraps this with the pre-flight checks; deploy/README.md)
#
# What it changes against the base docker-compose.yml (the public single-file
# install, which stays untouched):
#  - images pinned by digest (the tag is kept for reading; the digest wins);
#  - NO host ports at all. The only way in is caddy-lan over the external `edge`
#    network, behind the Authelia SSO gate (https://vscc.lan.synviron.com). The
#    app has no login of its own and carries patient data. Only the dashboard
#    joins `edge`; its nginx (deploy/dashboard-nginx.conf) fronts the backend on
#    the stack network: /api -> worker, /mqtt -> EMQX websocket,
#    /DataExportVSC.json + /ws/stream -> streamer. MQTT 1883, the EMQX admin UI
#    18083 and Postgres 5432 stay stack-internal;
#  - TimescaleDB lives on its OWN disk, bind-mounted from /srv/vscc-data (homelab
#    mounts it by UUID, nofail). create_host_path: false makes a missing mount
#    fail closed instead of silently filling the root disk. Session exports
#    (which grow too) live on that disk as well;
#  - mem_limit / cpus on every service (the host is RAM-constrained), log rotation;
#  - POSTGRES_PASSWORD is required, piped from BWS at deploy (never on disk).
#
# The database was restored from VM 242 (see deploy/migrate-212/README.md). Its
# retention policy is whatever vscc_settings.retention_hours says; the worker
# re-applies it on every start.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  emqx:
    image: emqx/emqx:6.0.0@sha256:8426e9b5a1fd7717fa9aaf5bb0ec53e68b5318ecab8d494e4ef720aa7bbfbe7a
    container_name: vscc-emqx
    ports: !reset []
    volumes:
      - vscc-emqx-data:/opt/emqx/data
    mem_limit: 768m
    cpus: 1.0
    logging: *logging

  timescaledb:
    image: timescale/timescaledb:2.19.3-pg14@sha256:0f5553d37abbe0f20bfe0a04dab5d1238955b5cda2711aba403090f95b6e51ff
    container_name: vscc-timescaledb
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be piped from BWS VSCC_POSTGRES_PASSWORD (see deploy/vscc-deploy.sh)}
      # timescaledb-tune runs at initdb; size it to the container, not the 16 GB host
      TS_TUNE_MEMORY: 2GB
      TS_TUNE_NUM_CPUS: "2"
      # no phone-home from a database holding patient data
      TIMESCALEDB_TELEMETRY: "off"
    volumes: !override
      - type: bind
        source: /srv/vscc-data/timescaledb
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    shm_size: 256m
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  capture:
    image: ghcr.io/chsbusch-dot/vscc-capture:latest@sha256:9a626324bc285f7a25c88b6cf86055c2e507830163be4336c1bd3a00aa27f5de
    container_name: vscc-capture
    # Bridge networking is enough: VSCapture's LAN mode is client-initiated UDP
    # to the monitor (association on port 24105, data back on the same flow), so
    # Docker's NAT/conntrack carries the replies. The MP50 (192.168.1.215) is
    # on-link from .212 (same /24 on ens32, no router hop).
    mem_limit: 512m
    cpus: 1.0
    logging: *logging

  worker:
    image: ghcr.io/chsbusch-dot/vscc-worker:latest@sha256:4ea2d3eea9ce72c82c0df3cbaa48ab25cf607b3e7d573c1b70c408b2880b5611
    container_name: vscc-worker
    ports: !reset []
    environment:
      # localizes auto-session label text only; data stays UTC (VM 242 used the same)
      SESSION_LABEL_TZ: ${SESSION_LABEL_TZ:-America/Los_Angeles}
    volumes: !override
      - vscc-data:/data
      - type: bind
        source: /srv/vscc-data/sessions
        target: /sessions
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 30s
    mem_limit: 1g
    cpus: 1.0
    logging: *logging

  streamer:
    image: ghcr.io/chsbusch-dot/vscc-streamer:latest@sha256:1aa5878ef33288264cf2c00bffd9e32a8c6bdc779b9ea4ee80d36c460f005e84
    container_name: vscc-streamer
    ports: !reset []
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

  dashboard:
    image: ghcr.io/chsbusch-dot/vscc-dashboard:latest@sha256:24359fc8d773b0a546a8e29b8a7dad1a2920b6635e10515b52177b79d7706aac
    container_name: vscc-dashboard
    ports: !reset []
    environment:
      # served over https by caddy-lan, which already forces same-origin URLs;
      # set explicitly so a plain-http test through an ssh tunnel behaves the same
      VSCC_SAME_ORIGIN: "1"
    volumes:
      - ./deploy/dashboard-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - edge
    mem_limit: 128m
    cpus: 0.5
    logging: *logging

volumes:
  vscc-emqx-data:
    name: vscc-emqx-data

networks:
  edge:
    external: true
