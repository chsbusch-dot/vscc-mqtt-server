# nginx for vscc-dashboard on the .212 app host. compose.production.yml mounts
# it over the image's stock default.conf.
#
# caddy-lan terminates TLS and runs the Authelia gate; it reaches this server as
# vscc-dashboard:80 over the `edge` network. This server serves the static app
# and fronts the backend, which never joins `edge`:
#   /api/*               -> worker   (REST API: sessions, settings, exports)
#   /mqtt                -> EMQX     (MQTT over WebSocket, the live data path)
#   /DataExportVSC.json  -> streamer (URL-polling data source)
#   /ws/stream           -> streamer (websocket data source)
# The dashboard uses these same-origin paths whenever it is served over https
# (vscc-dashboard-client src/utils/backendUrls.ts).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. Upstreams are variables so they resolve per request:
    # nginx starts, and the static app keeps working, while a backend is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $worker   http://vscc-worker:8000;
    set $streamer http://vscc-streamer:8000;
    set $emqx     http://vscc-emqx:8083;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/ {
        proxy_pass $worker;
        # session packages are streamed zips of up to several GB: don't buffer
        # them to disk, and give long exports time
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 10m;
    }

    location = /mqtt {
        proxy_pass $emqx;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /ws/stream {
        proxy_pass $streamer;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location = /DataExportVSC.json {
        proxy_pass $streamer;
    }

    # runtime config written by the entrypoint; never cache it
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
