%% EMQX authorization rules for the vscc PRODUCTION broker (vscc-emqx on .212,
%% WOR-1092). compose.production.yml mounts this file over the image's
%% /opt/emqx/etc/acl.conf. EMQX reads it at boot only: deploy/vscc-up.sh restarts
%% EMQX, together with the worker, whenever the running copy differs from this one.
%%
%% The broker has no authentication, so a username or client id proves nothing.
%% These rules key on the LISTENER instead, which a client cannot choose:
%%  - tcp:default (1883) is reachable only from inside the compose network (no
%%    host port, EMQX does not join `edge`). The worker publishes the live data
%%    there, and it is the only publisher.
%%  - every other listener may only subscribe. ws:default (8083) is where the
%%    dashboard's nginx sends /mqtt (deploy/dashboard-nginx.conf), so every
%%    browser, the premium dashboard included, lands there. ssl and wss are
%%    enabled in the image but neither published nor proxied.
%%
%% First match wins. The last rule denies the rest, so the outcome depends neither
%% on authorization.no_match nor on EMQX_SECURITY_PROFILE. A denied publish is
%% dropped (deny_action = ignore); an MQTT 5 QoS 1 publisher gets PUBACK 0x87.

%% nobody reads broker internals or subscribes to the whole tree
{deny, all, subscribe, ["$SYS/#", {eq, "#"}, {eq, "+/#"}]}.

%% the stack-internal listener: the worker
{allow, {listener, "tcp:default"}, all, ["#"]}.

%% everyone else, i.e. the dashboards over the websocket: subscribe only
{allow, all, subscribe, ["#"]}.

{deny, all}.
